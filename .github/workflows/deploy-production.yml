name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.117.0 }
      - run: npm ci
      - run: npm run test:all
      - name: Validate deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          EMAIL_REPORTS_ENABLED: ${{ vars.EMAIL_REPORTS_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORTS_FROM_EMAIL: ${{ secrets.REPORTS_FROM_EMAIL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          printf '%s' "$PROJECT_REF" | grep --extended-regexp --quiet '^[a-z0-9]{20}$'
          if [ "$EMAIL_REPORTS_ENABLED" = 'true' ]; then
            test -n "$RESEND_API_KEY"
            test -n "$REPORTS_FROM_EMAIL"
          fi
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
      - name: Sync email runtime secrets
        if: ${{ vars.EMAIL_REPORTS_ENABLED == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORTS_FROM_EMAIL: ${{ secrets.REPORTS_FROM_EMAIL }}
        run: supabase secrets set --project-ref "$PROJECT_REF" RESEND_API_KEY="$RESEND_API_KEY" REPORTS_FROM_EMAIL="$REPORTS_FROM_EMAIL"
      - name: Deploy report functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy send-report-email deliver-scheduled-report --project-ref "$PROJECT_REF"
